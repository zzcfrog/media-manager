<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>液态玻璃效果预览 · 映屿 · luminisle</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    body { margin: 0; padding: 32px; background: #f1f4f9; color: #203047; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { max-width: 1100px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.5px; }
    p { margin: 0 0 20px; color: #5c6c80; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    .controls label { display: flex; align-items: center; gap: 10px; }
    input { accent-color: #007aff; width: 160px; }
    output { width: 28px; font-variant-numeric: tabular-nums; }
    button { font: inherit; cursor: pointer; padding: 7px 14px; border: 1px solid #bdcbdc; border-radius: 999px; color: inherit; background: #ffffffd9; }
    button:focus-visible, input:focus-visible { outline: 2px solid #007aff; outline-offset: 3px; }
    .comparisons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    article { min-width: 0; border: 1px solid #d6e0ed; border-radius: 20px; overflow: hidden; background: #fff; }
    h2 { margin: 0; padding: 16px 20px; font-size: 15px; font-weight: 600; }
    .stage { padding: 40px 28px; overflow: hidden; background: repeating-linear-gradient(90deg, transparent 0 29px, #28558b 30px 33px, transparent 34px 59px), repeating-linear-gradient(0deg, #ecf5ff 0 29px, #b8d6ee 30px 33px, #fff 34px 59px); }
    .glass { position: relative; height: 220px; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; --lg-tint: rgba(255,255,255,.12); --lg-solid: #edf2f8; }
    .glass strong { padding: 4px 10px; border-radius: 8px; background: #ffffffdd; font-size: 15px; font-weight: 500; }
    .glass output { width: auto; padding: 0 8px; border-radius: 6px; background: #ffffffdd; }
    footer { margin-top: 20px; font-size: 12px; color: #65778d; }
    footer a { color: inherit; }
    #renderer { margin-bottom: 8px; }
    body.dark { color-scheme: dark; background: #1c222c; color: #e7edf5; }
    body.dark p, body.dark footer { color: #a4b2c5; }
    body.dark article { background: #293342; border-color: #455165; }
    body.dark .stage { background: repeating-linear-gradient(90deg, transparent 0 29px, #7f9bbf 30px 33px, transparent 34px 59px), repeating-linear-gradient(0deg, #26374e 0 29px, #536b8d 30px 33px, #1b2738 34px 59px); }
    body.dark button, body.dark .glass strong, body.dark .glass output { background: #253347e8; border-color: #647994; }
    body.dark .glass { --lg-tint: rgba(24,34,50,.2); --lg-solid: #293342; }
    @media (max-width: 720px) { body { padding: 20px; } .comparisons { grid-template-columns: 1fr; } .stage { padding: 28px 20px; } }
    @media (prefers-contrast: more) { .glass > .lg-layer { background: var(--lg-solid); backdrop-filter: none !important; -webkit-backdrop-filter: none !important; } }
    /* Include once. The component never styles your text, controls or layout. */
.lg-host { --lg-tint: rgb(255 255 255 / .07); }
.lg-layer, .lg-sheen {
  position: absolute;
  inset: 0;
  border-radius: var(--lg-radius, 24px);
  pointer-events: none;
}
.lg-layer {
  z-index: -1;
  overflow: hidden;
  background: var(--lg-tint);
  -webkit-backdrop-filter: blur(var(--lg-blur, 0px)) saturate(1.15);
  backdrop-filter: blur(var(--lg-blur, 0px)) saturate(1.15);
  box-shadow: 0 12px 36px rgb(0 0 0 / .12);
}
.lg-host[data-lg-renderer="svg"] > .lg-layer {
  backdrop-filter: var(--lg-filter) saturate(1.15);
}
.lg-sheen {
  z-index: 1;
  opacity: var(--lg-light, .22);
  background: radial-gradient(ellipse at var(--lg-pointer-x, 25%) var(--lg-pointer-y, 10%), rgb(255 255 255 / .42), transparent 60%);
  box-shadow: inset 0 1px 1px rgb(255 255 255 / .95), inset 0 -1px 1px rgb(255 255 255 / .5), inset 0 0 0 1px rgb(255 255 255 / .5);
}
/* Opaque enough to read when the platform requests reduced transparency. */
@media (prefers-reduced-transparency: reduce) {
  .lg-host > .lg-layer { background: var(--lg-solid, #e7edf2); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .lg-host[data-lg-renderer="svg"] > .lg-layer { backdrop-filter: none; }
}

  </style>
</head>
<body>
<main>
  <h1>液态玻璃效果预览</h1>
  <p>观察玻璃边缘的网格弯折。文字和按钮保持清晰，可以移动鼠标查看高光。</p>
  <div class="controls">
    <label for="amount">折射强度 <input id="amount" type="range" min="0" max="100" value="60"><output id="value" for="amount">60</output></label>
    <button id="theme" type="button" aria-pressed="false">切换深浅色</button>
    <button id="reset" type="button">恢复默认</button>
  </div>
  <div class="comparisons">
    <article><h2>无折射对照</h2><div class="stage"><div class="glass" id="baseline"><strong>观察网格的直线</strong><button type="button">点按测试</button><output aria-live="polite">已点击 0 次</output></div></div></article>
    <article><h2>液态玻璃</h2><div class="stage"><div class="glass" id="refracted"><strong>观察边缘的弯折</strong><button type="button">点按测试</button><output aria-live="polite">已点击 0 次</output></div></div></article>
  </div>
  <footer>
    <div id="renderer" role="status">正在加载效果…</div>
    <div>独立演示页，可离线打开；不连接资料库。效果代码来自 <a href="https://github.com/kwlck/liquid-glass-web/tree/a77866771c280eb3edfc108111a01541db6634dc">liquid-glass-web</a>（MIT），包含已评估的初始化调整。</div>
  </footer>
</main>

<script>
const createLiquidGlass = (() => {
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

/** Signed distance in CSS pixels; negative values are inside the surface. */
function distance(x, y, width, height, radius, shape) {
  const a = width / 2;
  const b = height / 2;
  if (shape === 'ellipse') {
    if (x === 0 && y === 0) return -Math.min(a, b);
    const k0 = Math.hypot(x / a, y / b);
    const k1 = Math.hypot(x / (a * a), y / (b * b));
    return k0 * (k0 - 1) / k1;
  }
  const r = shape === 'pill' ? Math.min(a, b) : clamp(radius, 0, Math.min(a, b));
  const qx = Math.abs(x) - a + r;
  const qy = Math.abs(y) - b + r;
  return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - r;
}

/** R/G encode the sampling offset. Each channel's neutral value is 128. */
function displacementMap(width, height, radius, shape, resolution = 1) {
  const w = Math.max(1, Math.round(width * resolution));
  const h = Math.max(1, Math.round(height * resolution));
  const pixels = new Uint8ClampedArray(w * h * 4);
  const bevel = Math.min(32, Math.min(width, height) * 0.16);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const px = (x + 0.5) / w * width - width / 2;
      const py = (y + 0.5) / h * height - height / 2;
      const sdf = distance(px, py, width, height, radius, shape);
      const gx = distance(px + 0.5, py, width, height, radius, shape) - distance(px - 0.5, py, width, height, radius, shape);
      const gy = distance(px, py + 0.5, width, height, radius, shape) - distance(px, py - 0.5, width, height, radius, shape);
      const length = Math.hypot(gx, gy) || 1;
      const t = clamp(-sdf / bevel, 0, 1);
      const curvature = Math.pow(1 - t * t * (3 - 2 * t), 1.65);
      const inside = sdf <= 0 ? 1 : 0;
      const index = (y * w + x) * 4;
      pixels[index] = 128 - gx / length * curvature * inside * 127;
      pixels[index + 1] = 128 - gy / length * curvature * inside * 127;
      pixels[index + 2] = 128;
      pixels[index + 3] = 255;
    }
  }
  return { width: w, height: h, pixels };
}


const SVG = 'http://www.w3.org/2000/svg';
const instances = new WeakMap();
let nextId = 0;
const defaults = Object.freeze({ refraction: 100, blur: 0, light: 22, radius: 24, shape: 'rounded', mode: 'auto', pointer: true, resolution: 1 });

function optionsFrom(current, changes) {
  const value = { ...current, ...changes };
  for (const key of ['refraction', 'blur', 'light', 'radius', 'resolution']) {
    if (typeof value[key] !== 'number' || !Number.isFinite(value[key])) throw new TypeError(`${key} must be a finite number`);
  }
  if (!['rounded', 'pill', 'ellipse'].includes(value.shape)) throw new TypeError('shape must be rounded, pill or ellipse');
  if (!['auto', 'svg', 'css'].includes(value.mode)) throw new TypeError('mode must be auto, svg or css');
  if (typeof value.pointer !== 'boolean') throw new TypeError('pointer must be a boolean');
  value.refraction = Math.max(0, Math.min(100, value.refraction));
  value.blur = Math.max(0, Math.min(40, value.blur));
  value.light = Math.max(0, Math.min(100, value.light));
  value.radius = Math.max(0, value.radius);
  value.resolution = Math.max(0.25, Math.min(2, value.resolution));
  return Object.freeze(value);
}

function svgElement(document, tag, attributes = {}) {
  const element = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, String(value));
  return element;
}

/** Attach to an existing card, button or navigation element. No image required. */
function createLiquidGlass(target, options = {}) {
  const element = typeof target === 'string' ? document.querySelector(target) : target;
  if (!element || element.nodeType !== 1) throw new TypeError('Target must be an existing HTML element');
  if (element.namespaceURI !== 'http://www.w3.org/1999/xhtml') throw new TypeError('Target must be an HTML element');
  if (/^(AREA|BASE|BR|COL|EMBED|HR|IMG|INPUT|LINK|META|PARAM|SOURCE|TRACK|WBR|SELECT|TEXTAREA|TABLE|TR|THEAD|TBODY|TFOOT)$/.test(element.tagName)) throw new TypeError('Target must be a container such as a div, article, nav or button');
  if (instances.has(element)) return instances.get(element).update(options);
  const instance = new LiquidGlass(element, options);
  instances.set(element, instance);
  return instance;
}

class LiquidGlass {
  constructor(element, options) {
    this.element = element;
    this.options = optionsFrom(defaults, options);
    this.document = element.ownerDocument;
    this.window = this.document.defaultView;
    this.destroyed = false;
    this.frame = 0;
    this.pointerFrame = 0;
    this.savedStyles = new Map();
    this.hadClass = element.classList.contains('lg-host');
    this.savedRenderer = element.getAttribute('data-lg-renderer');
    this.layer = this.document.createElement('span');
    this.sheen = this.document.createElement('span');
    this.layer.className = 'lg-layer';
    this.sheen.className = 'lg-sheen';
    this.layer.setAttribute('aria-hidden', 'true');
    this.sheen.setAttribute('aria-hidden', 'true');
    // Avoid wrapping or moving content, preserving listeners and focus order.
    element.prepend(this.layer);
    element.append(this.sheen);
    element.classList.add('lg-host');
    const computed = this.window.getComputedStyle(element);
    if (computed.position === 'static') this.setStyle('position', 'relative');
    if (computed.zIndex === 'auto') this.setStyle('z-index', '0');

    this.id = `liquid-glass-${++nextId}`;
    this.svg = svgElement(this.document, 'svg', { 'aria-hidden': 'true', width: 0, height: 0 });
    this.svg.style.cssText = 'position:absolute;pointer-events:none;overflow:hidden;';
    this.filter = svgElement(this.document, 'filter', { id: this.id, filterUnits: 'userSpaceOnUse', 'color-interpolation-filters': 'sRGB' });
    this.image = svgElement(this.document, 'feImage', { result: 'map', preserveAspectRatio: 'none', href: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%221%22 height=%221%22%3E%3Crect width=%221%22 height=%221%22 fill=%22%23808080%22/%3E%3C/svg%3E' });
    this.displacement = svgElement(this.document, 'feDisplacementMap', { in: 'SourceGraphic', in2: 'map', xChannelSelector: 'R', yChannelSelector: 'G', result: 'refracted' });
    this.blur = svgElement(this.document, 'feGaussianBlur', { in: 'refracted', stdDeviation: 0 });
    this.filter.append(this.image, this.displacement, this.blur);
    const defs = svgElement(this.document, 'defs');
    defs.append(this.filter);
    this.svg.append(defs);
    // Keep references in the same document/root as the surface.
    const root = element.getRootNode();
    (root.nodeType === 11 ? root : this.document.body).append(this.svg);
    this.canvas = this.document.createElement('canvas');
    this.onPointer = (event) => {
      if (!this.options.pointer || this.window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rect = element.getBoundingClientRect();
      this.pointer = { x: (event.clientX - rect.left) / (rect.width || 1) * 100, y: (event.clientY - rect.top) / (rect.height || 1) * 100 };
      if (!this.pointerFrame) this.pointerFrame = this.window.requestAnimationFrame(() => {
        this.pointerFrame = 0;
        this.setStyle('--lg-pointer-x', `${this.pointer.x}%`);
        this.setStyle('--lg-pointer-y', `${this.pointer.y}%`);
      });
    };
    element.addEventListener('pointermove', this.onPointer, { passive: true });
    this.onResize = () => this.refresh();
    if (this.window.ResizeObserver) {
      this.observer = new this.window.ResizeObserver(this.onResize);
      this.observer.observe(element);
    } else this.window.addEventListener('resize', this.onResize);
    this.applyOptions();
    this.refresh();
  }

  setStyle(name, value) {
    if (!this.savedStyles.has(name)) this.savedStyles.set(name, { value: this.element.style.getPropertyValue(name), priority: this.element.style.getPropertyPriority(name) });
    this.element.style.setProperty(name, value);
  }

  get renderer() { return this.element.getAttribute('data-lg-renderer'); }

  applyOptions() {
    const options = this.options;
    // CSS.supports(url(...)) only checks syntax, not actual rendering. Auto
    // conservatively enables the SVG backdrop path on desktop/Android Blink.
    const ua = this.window.navigator.userAgent;
    const blink = /Chrome|Chromium|Edg\//.test(ua) && !/iPhone|iPad|iPod/.test(ua);
    const renderer = options.mode === 'svg' || (options.mode === 'auto' && blink) ? 'svg' : 'css';
    this.element.setAttribute('data-lg-renderer', renderer);
    this.setStyle('--lg-filter', `url("#${this.id}")`);
    this.setStyle('--lg-blur', `${options.blur}px`);
    this.setStyle('--lg-light', String(options.light / 100));
    this.displacement.setAttribute('scale', String(options.refraction / 100 * 86));
    this.blur.setAttribute('stdDeviation', String(options.blur / 2));
    if (!options.pointer) {
      this.window.cancelAnimationFrame(this.pointerFrame);
      this.pointerFrame = 0;
      this.setStyle('--lg-pointer-x', '25%');
      this.setStyle('--lg-pointer-y', '10%');
    }
  }

  update(changes = {}) {
    if (this.destroyed) throw new Error('This glass instance has been destroyed');
    const before = this.options;
    this.options = optionsFrom(before, changes);
    this.applyOptions();
    if (before.radius !== this.options.radius || before.shape !== this.options.shape || before.resolution !== this.options.resolution || before.mode !== this.options.mode) this.refresh();
    return this;
  }

  refresh() {
    if (this.destroyed || this.frame) return this;
    this.frame = this.window.requestAnimationFrame(() => {
      this.frame = 0;
      const width = this.element.offsetWidth;
      const height = this.element.offsetHeight;
      if (!width || !height) return; // ResizeObserver wakes hidden elements later.
      const { shape, radius, resolution } = this.options;
      this.setStyle('--lg-radius', shape === 'ellipse' ? '50%' : `${shape === 'pill' ? Math.min(width, height) / 2 : Math.min(radius, width / 2, height / 2)}px`);
      if (this.renderer === 'css') return;
      // Bound memory/cost for large panels. Never allocate a viewport-sized map.
      const density = Math.min(resolution, 1024 / width, 1024 / height);
      const map = displacementMap(width, height, radius, shape, density);
      this.canvas.width = map.width;
      this.canvas.height = map.height;
      const context = this.canvas.getContext('2d');
      if (!context) { this.element.setAttribute('data-lg-renderer', 'css'); return; }
      const data = context.createImageData(map.width, map.height);
      data.data.set(map.pixels);
      context.putImageData(data, 0, 0);
      for (const node of [this.filter, this.image]) {
        node.setAttribute('x', '0'); node.setAttribute('y', '0');
        node.setAttribute('width', String(width)); node.setAttribute('height', String(height));
      }
      this.image.setAttribute('href', this.canvas.toDataURL());
    });
    return this;
  }

  destroy() {
    if (this.destroyed) return;
    this.destroyed = true;
    this.window.cancelAnimationFrame(this.frame);
    this.window.cancelAnimationFrame(this.pointerFrame);
    this.observer?.disconnect();
    this.window.removeEventListener('resize', this.onResize);
    this.element.removeEventListener('pointermove', this.onPointer);
    this.layer.remove(); this.sheen.remove(); this.svg.remove();
    for (const [name, saved] of this.savedStyles) {
      if (saved.value) this.element.style.setProperty(name, saved.value, saved.priority);
      else this.element.style.removeProperty(name);
    }
    if (!this.hadClass) this.element.classList.remove('lg-host');
    if (this.savedRenderer === null) this.element.removeAttribute('data-lg-renderer');
    else this.element.setAttribute('data-lg-renderer', this.savedRenderer);
    instances.delete(this.element);
  }
}

return createLiquidGlass;
})();
try {
  const baseline = createLiquidGlass('#baseline', { refraction: 0, radius: 24, blur: 0, light: 22 });
  const refracted = createLiquidGlass('#refracted', { refraction: 60, radius: 24, blur: 0, light: 22 });
  const amount = document.querySelector('#amount');
  amount.addEventListener('input', () => {
    document.querySelector('#value').textContent = amount.value;
    refracted.update({ refraction: Number(amount.value) });
  });
  const theme = document.querySelector('#theme');
  theme.addEventListener('click', () => {
    theme.setAttribute('aria-pressed', String(document.body.classList.toggle('dark')));
  });
  document.querySelector('#reset').addEventListener('click', () => {
    amount.value = '60'; amount.dispatchEvent(new Event('input'));
    document.body.classList.remove('dark'); theme.setAttribute('aria-pressed', 'false');
  });
  for (const glass of document.querySelectorAll('.glass')) {
    let clicks = 0;
    glass.querySelector('button').addEventListener('click', () => { glass.querySelector('output').textContent = '已点击 ' + (++clicks) + ' 次'; });
  }
  document.querySelector('#renderer').textContent = refracted.renderer === 'svg'
    ? '已启用折射模式，可拖动上方滑块对比强度。'
    : '当前浏览器使用兼容模式；Chrome 或 Edge 可查看完整折射效果。';
  window.addEventListener('pagehide', () => { baseline.destroy(); refracted.destroy(); }, { once: true });
} catch (error) {
  document.querySelector('#renderer').textContent = '效果加载失败：' + error.message;
}
</script>
</body>
